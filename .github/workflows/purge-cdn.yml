# Clears jsDelivr's cached copy of the add-on whenever main gets a new one (v0.83.0).
#
# Installed loaders fetch cdn/HypnosisAddon.js from jsDelivr following main. jsDelivr caches a
# branch URL for up to 12 hours by its own documentation, so without this a release could take
# half a day to reach testers, and two testers in one room could be on different builds for all
# of it. The purge endpoint is jsDelivr's documented one; it was NOT reachable from the workspace
# this was written in, so the first run of this job is its first real test. A failed purge fails
# the job, visibly, on the Actions tab; the cost of a failure is lag, never a broken install.
name: Purge jsDelivr cache

on:
  push:
    branches: [main]
    paths: [cdn/HypnosisAddon.js]
  workflow_dispatch:

permissions: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge the bundle the loader fetches
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            "https://purge.jsdelivr.net/gh/Dwfreegethub/HypnosisAddon@main/cdn/HypnosisAddon.js"
          echo
